name: Canary Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version 1.0.1'
        required: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build

      - name: Generate canary tag
        id: tag
        run: |
          DATE=$(date +'%Y-%m-%d-%H%M%S')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          CANARY_TAG="canary-$DATE-$SHA_SHORT"
          echo "tag_name=$CANARY_TAG" >> $GITHUB_OUTPUT

      - name: Create Canary Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Canary ${{ steps.tag.outputs.tag_name }}"
          tag_name: ${{ steps.tag.outputs.tag_name }}
          prerelease: true
          body: |
            ### Это экспериментальная сборка из ветки `${{ github.ref_name }}`. 
            
            **Информация о сборке:**
            - Дата: ${{ github.event.head_commit.timestamp }}
            - Коммит: ${{ github.sha }}
          files: build/libs/*.jar 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
