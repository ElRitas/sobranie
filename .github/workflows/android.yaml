name: Android CI

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build API
        run: cd src && ./gradlew :api:build --stacktrace

      - name: Build UI
        run: cd src && ./gradlew :ui:assembleDebug --stacktrace

  style:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Ktlint (Code style)
        run: cd src && ./gradlew ktlintCheck --stacktrace

  tests:
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Unit Tests
        run: cd src && ./gradlew test --stacktrace

      - name: Integration Tests
        run: cd src && ./gradlew integrationTest --stacktrace

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare release environment file
        run: |
          cat <<'EOF' > /tmp/api-release.env
          PORT=8080
          DB_URL=jdbc:postgresql://example-host:5432/library
          DB_USER=release_candidate
          DB_PASSWORD=release_candidate
          JWT_SECRET=release_candidate_secret
          EOF

      - name: Build immutable API artifact
        run: bash scripts/api_lifecycle.sh build ci-${{ github.sha }}

      - name: Create release candidate
        run: bash scripts/api_lifecycle.sh release ci-${{ github.sha }} rc-${{ github.run_id }} /tmp/api-release.env

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-release-candidate-${{ github.run_id }}
          path: deploy/releases/rc-${{ github.run_id }}
